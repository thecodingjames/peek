<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">

    <script src="vendor/vue-3.5.33.js"></script>

    <script src="vendor/vuetify-4.0.6.js"></script>
    <link rel="stylesheet" href="vendor/vuetify-4.0.6.css" />
    <link rel="stylesheet" href="vendor/mdi-5.min.css" />

    <link rel="stylesheet" href="assets/global.css" />

    <script src="vendor/sortable-1.15.7.js"></script>

    <script type="module">
      import * as Vest from './vendor/vest-6.3.2.js'
      import * as VueVirtual from './vendor/tanstack-virtual-vue.js'

      // Make it global to mirror Vue/VueRouter/Vuetify behavior
      window.Vest = Vest
      window.VueVirtual = VueVirtual
    </script>

  </head>
  <body>
    <div id="app"></div>

    <script type="module"> 
      import App from './app/app.js'
      import translate from './app/translate/translate.service.js'

      import FileInput from './app/http/request/details/body/file-input.js'
      import DialogEditableInput from './app/http/request/dialog-editable/dialog-editable-input.js'
      import DialogEditable from './app/http/request/dialog-editable/dialog-editable.js'

      const app = Vue.createApp(App)
      app.component('FileInput', FileInput)
      app.component('DialogEditableInput', DialogEditableInput)
      app.component('DialogEditable', DialogEditable)

      app.use(Vuetify.createVuetify())

      const electronApp = await electron.app()
      app.config.globalProperties.app = electronApp
      app.config.globalProperties.t = translate

      app.mount('#app')
    </script>
  </body>
</html>
